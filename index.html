<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бот-провокатор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            color: white;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .task-form {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #666);
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-button-color, #e0e0e0);
            border-radius: 10px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #667eea);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .quick-btn {
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #333);
            font-size: 14px;
        }
        
        .tasks-list {
            margin-top: 20px;
        }
        
        .task-card {
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .task-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .task-deadline {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 10px;
        }
        
        .task-buttons {
            display: flex;
            gap: 10px;
        }
        
        .task-btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }
        
        .complete-btn {
            background: #4caf50;
        }
        
        .snooze-btn {
            background: #ff9800;
        }
        
        .cancel-btn {
            background: #f44336;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 5px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .nav-btn {
            flex: 1;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #333);
        }
        
        .active-nav {
            background: #667eea;
            color: white;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Бот-провокатор</h1>
            <p>Добавляй задачи, я буду напоминать с юмором!</p>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn active-nav" onclick="showSection('add')">➕ Добавить</button>
            <button class="nav-btn" onclick="showSection('tasks')">📋 Мои задачи</button>
            <button class="nav-btn" onclick="showSection('stats')">📊 Статистика</button>
        </div>
        
        <!-- Секция добавления задачи -->
        <div id="addSection" class="task-form">
            <div class="form-group">
                <label>📝 Что нужно сделать?</label>
                <input type="text" id="taskDescription" placeholder="Например: Сделать лабораторную работу">
            </div>
            
            <div class="form-group">
                <label>⏰ Когда напомнить?</label>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setDeadline('1h')">Через 1 час</button>
                    <button class="quick-btn" onclick="setDeadline('today18')">Сегодня 18:00</button>
                    <button class="quick-btn" onclick="setDeadline('tomorrow9')">Завтра 09:00</button>
                    <button class="quick-btn" onclick="setCustomTime()">Своё время</button>
                </div>
                <input type="time" id="customTime" style="margin-top: 10px; display: none;">
            </div>
            
            <button onclick="createTask()">✨ Создать задачу</button>
        </div>
        
        <!-- Секция задач -->
        <div id="tasksSection" class="tasks-list hidden">
            <div id="tasksList"></div>
        </div>
        
        <!-- Секция статистики -->
        <div id="statsSection" class="hidden">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="activeCount">0</div>
                    <div class="stat-label">Активных задач</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Выполнено</div>
                </div>
            </div>
            <div class="task-form">
                <h3 style="margin-bottom: 15px;">✅ Последние выполненные</h3>
                <div id="completedTasks"></div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        let currentDeadline = null;
        
        function showSection(section) {
            document.getElementById('addSection').classList.add('hidden');
            document.getElementById('tasksSection').classList.add('hidden');
            document.getElementById('statsSection').classList.add('hidden');
            
            if (section === 'add') {
                document.getElementById('addSection').classList.remove('hidden');
            } else if (section === 'tasks') {
                document.getElementById('tasksSection').classList.remove('hidden');
                loadTasks();
            } else if (section === 'stats') {
                document.getElementById('statsSection').classList.remove('hidden');
                loadStats();
            }
            
            updateNavButtons(section);
        }
        
        function updateNavButtons(section) {
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => btn.classList.remove('active-nav'));
            if (section === 'add') btns[0].classList.add('active-nav');
            else if (section === 'tasks') btns[1].classList.add('active-nav');
            else if (section === 'stats') btns[2].classList.add('active-nav');
        }
        
        function setDeadline(type) {
            const now = new Date();
            let deadline = new Date();
            
            if (type === '1h') {
                deadline.setHours(now.getHours() + 1);
            } else if (type === 'today18') {
                deadline.setHours(18, 0, 0);
                if (deadline < now) deadline.setDate(deadline.getDate() + 1);
            } else if (type === 'tomorrow9') {
                deadline.setDate(now.getDate() + 1);
                deadline.setHours(9, 0, 0);
            }
            
            currentDeadline = deadline;
            tg.showAlert(`⏰ Напомню ${deadline.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`);
        }
        
        function setCustomTime() {
            const timeInput = document.getElementById('customTime');
            timeInput.style.display = 'block';
            timeInput.addEventListener('change', function() {
                const [hours, minutes] = this.value.split(':');
                const deadline = new Date();
                deadline.setHours(parseInt(hours), parseInt(minutes), 0);
                if (deadline < new Date()) deadline.setDate(deadline.getDate() + 1);
                currentDeadline = deadline;
                timeInput.style.display = 'none';
                tg.showAlert(`⏰ Напомню ${deadline.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`);
            });
        }
        
        function createTask() {
            const description = document.getElementById('taskDescription').value.trim();
            if (!description) {
                tg.showAlert('❌ Напиши, что нужно сделать!');
                return;
            }
            
            if (!currentDeadline) {
                tg.showAlert('⏰ Выбери время напоминания!');
                return;
            }
            
            tg.sendData(JSON.stringify({
                action: 'create_task',
                description: description,
                deadline: currentDeadline.toISOString()
            }));
            
            tg.showAlert('✅ Задача создана! Бот будет напоминать 😈');
            document.getElementById('taskDescription').value = '';
            currentDeadline = null;
        }
        
        function loadTasks() {
            tg.sendData(JSON.stringify({ action: 'get_tasks' }));
        }
        
        function loadStats() {
            tg.sendData(JSON.stringify({ action: 'get_stats' }));
        }
        
        function completeTask(taskId) {
            tg.sendData(JSON.stringify({ action: 'complete_task', task_id: taskId }));
        }
        
        function snoozeTask(taskId) {
            tg.sendData(JSON.stringify({ action: 'snooze_task', task_id: taskId }));
        }
        
        function cancelTask(taskId) {
            tg.sendData(JSON.stringify({ action: 'cancel_task', task_id: taskId }));
        }
        
        tg.onEvent('customMethodInvoked', function(event) {
            if (event.eventType === 'viewportChanged') {
                tg.expand();
            }
        });
    </script>
</body>
</html>
