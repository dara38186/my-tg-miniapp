<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Бот-провокатор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            padding-bottom: 80px;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
        }
        .task-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .task-desc {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            word-break: break-word;
        }
        .task-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-warning { background: #FF9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-primary {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
        .form-section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--tg-theme-hint-color);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--tg-theme-hint-color);
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--tg-theme-hint-color);
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-size: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }
        .stats {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            cursor: pointer;
        }
        .tab.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤪 Бот-провокатор</h1>
        <div class="subtitle">Твои задачи под контролем</div>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('active')">📋 Активные</div>
        <div class="tab" onclick="switchTab('completed')">✅ Выполненные</div>
    </div>
    
    <div id="activeTab">
        <div id="activeTasks"></div>
    </div>
    
    <div id="completedTab" style="display:none;">
        <div id="completedTasks"></div>
    </div>
    
    <div class="form-section">
        <h3 style="margin-bottom: 16px;">➕ Новая задача</h3>
        <div class="form-group">
            <label>Что нужно сделать?</label>
            <input type="text" id="taskDesc" placeholder="Например: сделать лабораторную работу">
        </div>
        <div class="form-group">
            <label>Когда напомнить?</label>
            <select id="timeSelect">
                <option value="1h">⏰ Через 1 час</option>
                <option value="2h">⏰ Через 2 часа</option>
                <option value="4h">⏰ Через 4 часа</option>
                <option value="today18">🌆 Сегодня в 18:00</option>
                <option value="tomorrow9">🌅 Завтра в 09:00</option>
                <option value="tomorrow18">🌇 Завтра в 18:00</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addTask()" style="width:100%">➕ Добавить задачу</button>
    </div>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
        let botToken = "8645721403:AAFAmHaJ3HjxBuHTAtInjJ1rKfmUWlQPl7g";
        
        if (!userId) {
            document.body.innerHTML = '<div class="empty-state">❌ Ошибка: не удалось определить пользователя</div>';
        }
        
        let currentTab = 'active';
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', (i === 0 && tab === 'active') || (i === 1 && tab === 'completed'));
            });
            document.getElementById('activeTab').style.display = tab === 'active' ? 'block' : 'none';
            document.getElementById('completedTab').style.display = tab === 'completed' ? 'block' : 'none';
            if (tab === 'active') loadActiveTasks();
            else loadCompletedTasks();
        }
        
        async function callBotMethod(method, params) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/${method}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                return await response.json();
            } catch (error) {
                console.error('Ошибка:', error);
                return null;
            }
        }
        
        async function loadActiveTasks() {
            document.getElementById('activeTasks').innerHTML = '<div class="loading">⏳ Загрузка...</div>';
            
            // Отправляем команду боту получить задачи
            const result = await callBotMethod('sendMessage', {
                chat_id: userId,
                text: '/myday'
            });
            
            // Простой способ: показываем инструкцию
            document.getElementById('activeTasks').innerHTML = `
                <div class="stats">📊 Активные задачи</div>
                <div class="task-card">
                    <div class="task-desc">💡 Нажми "Загрузить" чтобы обновить</div>
                    <div class="task-buttons">
                        <button class="btn btn-success" onclick="refreshTasks()">🔄 Загрузить задачи</button>
                    </div>
                </div>
            `;
        }
        
        async function loadCompletedTasks() {
            document.getElementById('completedTasks').innerHTML = '<div class="loading">⏳ Загрузка...</div>';
            document.getElementById('completedTasks').innerHTML = `
                <div class="stats">🏆 Выполненные задачи</div>
                <div class="empty-state">Выполненные задачи появятся здесь после завершения</div>
            `;
        }
        
        async function refreshTasks() {
            tg.showPopup({title: 'Обновление', message: 'Проверьте чат с ботом — там список ваших задач!'});
        }
        
        async function addTask() {
            let desc = document.getElementById('taskDesc').value.trim();
            if (!desc) {
                tg.showPopup({title: 'Ошибка', message: 'Введите описание задачи'});
                return;
            }
            
            let timeValue = document.getElementById('timeSelect').value;
            let timeText = {
                '1h': 'Через 1 час',
                '2h': 'Через 2 часа',
                '4h': 'Через 4 часа',
                'today18': 'Сегодня в 18:00',
                'tomorrow9': 'Завтра в 09:00',
                'tomorrow18': 'Завтра в 18:00'
            }[timeValue];
            
            // Отправляем команду боту через сообщение
            await callBotMethod('sendMessage', {
                chat_id: userId,
                text: `/new ${desc}`
            });
            
            tg.showPopup({
                title: '✅ Задача добавлена!',
                message: `"${desc}"\nНапомнить: ${timeText}\n\nБот начнёт доставать тебя напоминаниями!`,
                buttons: [{type: 'ok'}]
            });
            
            document.getElementById('taskDesc').value = '';
            tg.HapticFeedback.notificationOccurred('success');
        }
        
        // Загружаем задачи при старте
        loadActiveTasks();
    </script>
</body>
</html>
